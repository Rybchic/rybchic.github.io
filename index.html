<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin-top: 20%; 
            background-color: #f4f4f9;
        }
        h1 { color: #333; }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Привет, интернет! 🚀</h1>
        <p>Это мой самый первый локальный сайт.</p>
    </div>
</body>
</html>
